# Free web service only; PostgreSQL is a separate Neon Free project.
services:
  - type: web
    name: careflow-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AI_MODE
        value: mock
      - key: AI_API_KEY
        value: ""
      - key: CLINIC_TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false
