server {
  listen 80;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
  location /api { proxy_pass http://backend:8000; proxy_read_timeout 90s; }
  location / { try_files $uri /index.html; }
}
